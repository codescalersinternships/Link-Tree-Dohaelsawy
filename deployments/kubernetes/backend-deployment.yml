apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: dohaelsawi/linktreeapp:latest
        ports:
        - containerPort: 8010
        env:
        - name: DB_HOST
          value: postgres-service
        - name: ALLOW_ORIGIN
          value: http://185.206.122.17:31111
      
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8010
      targetPort: 8010
      nodePort: 31010