apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Values.label }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.label }}
    spec:
      containers:
      - name: {{ .Values.label }}
        image:  {{ .Values.image }}
        ports:
        - containerPort: 8020
        env:
        - name: VITE_AXIOS_API
          value: {{ .Values.clusterIP }}:{{ .Values.nodePortBackend }}
      
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.label }}-service
spec:
  type: NodePort
  selector:
    app: {{ .Values.label }}
  ports:
    - protocol: TCP
      port: {{ .Values.servicePort }}
      targetPort: 8020
      nodePort: {{ .Values.nodePortFront }}