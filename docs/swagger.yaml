          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
      security:
      - basic: []
      summary: Edit Account
      tags:
      - account
  /account/get_account:
    get:
      consumes:
      - application/json
      description: Get Account data
