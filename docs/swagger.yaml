definitions:
  controllers.AccountReq:
    properties:
      bio:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        maxLength: 11
        minLength: 11
        type: string
    type: object
  controllers.ErrResponse:
    properties:
      error:
        type: string
      status_code:
        type: integer
    type: object
  controllers.LinkReq:
    properties:
      name:
        type: string
      url:
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  controllers.SuccessResponse:
    properties:
      data: {}
      status_code:
        type: integer
    type: object
  controllers.UserImageReq:
    type: object
host: localhost:8010
info:
  contact: {}
  description: platform that allows users to share social media profiles, or other
    important links defined in a single place
  title: LinkTree
  version: "1.0"
paths:
  /account/add_photo:
    post:
      consumes:
      - multipart/form-data
      description: Upload User Image
      parameters:
      - description: image
        in: body
        name: UserImageReq
        required: true
        schema:
          $ref: '#/definitions/controllers.UserImageReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
      security:
      - basic: []
      summary: Upload User Image
      tags:
      - account
