            $ref: '#/definitions/controllers.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrResponse'
      security:
      - basic: []
      summary: Get Account
      tags:
      - account
  /analytics/get_analytics/{user_id}:
    get:
      consumes:
      - application/json
      description: Get Analytics properties of how many users view the tree links
        and their users name
      parameters:
      - description: user ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
