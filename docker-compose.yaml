version: '3.9'
services:
  postgresdb:
      image: postgres:latest
      container_name: postgres_container
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - DATABASE_HOST=${DB_HOST}
        
      ports:
        - '1234:5432'
      volumes:
        - ./backend/database/pg_data:/var/lib/postgresql/data
      networks:
        - linktreenet

  postgresdbtest:
    image: postgres:latest
    container_name: postgres_test_container
    environment:
      - POSTGRES_USER=${DB_TEST_USER}
      - POSTGRES_PASSWORD=${DB_TEST_PASSWORD}
      - POSTGRES_DB=${DB_TEST_NAME}
      - DATABASE_HOST=${DB_TEST_HOST}
    ports:
      - '4568:5432'
    volumes:
      - ./backend/database/pg_data_test:/var/lib/postgresql/data
    networks:
      - linktreenet
  
  backend:
    container_name: golang_container
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_TEST_USER=${DB_TEST_USER}
      - DB_TEST_PASSWORD=${DB_TEST_PASSWORD}
      - DB_TEST_NAME=${DB_TEST_NAME}
      - DB_TEST_HOST=${DB_TEST_HOST}
      - DB_TEST_PORT=${DB_TEST_PORT}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ALLOW_ORIGIN=${ALLOW_ORIGIN}
    tty: true
    build: 
      context: ./backend
      dockerfile: Dockerfile.golang
    ports:
      - 8010:8010
    restart: on-failure
    depends_on:
      - postgresdb
    networks:
      - linktreenet


  frontend:
    container_name: vue_container
    tty: true
    build: 
      context: ./frontend
      dockerfile: Dockerfile.vue
    environment:
      VUE_APP_API_URL: http://localhost:8010
    ports:
      - 8020:8020
    restart: on-failure
    depends_on:
      - backend
    networks:
      - linktreenet

  
volumes:
  pg_data:

networks:
  linktreenet:
    driver: bridge